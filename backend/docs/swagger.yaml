basePath: /api
definitions:
  handlers.AccessTokenGenerateRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handlers.AccessTokenResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  handlers.Err:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/handlers.ErrDetail'
        type: array
      message:
        type: string
      request_id:
        type: string
    type: object
  handlers.ErrDetail:
    properties:
      code:
        type: string
      field:
        type: string
      message:
        type: string
    type: object
  handlers.ErrResponse:
    properties:
      error:
        $ref: '#/definitions/handlers.Err'
    type: object
  handlers.HealthResponse:
    properties:
      status:
        type: string
    type: object
  handlers.MessageResponse:
    properties:
      message:
        type: string
    type: object
  handlers.ProjectTypeListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.ProjectTypeResponse'
        type: array
    type: object
  handlers.ProjectTypeResponse:
    properties:
      label:
        type: string
      label_jp:
        type: string
      type:
        type: string
    type: object
  handlers.TaskFrequencyListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.TaskFrequencyResponse'
        type: array
    type: object
  handlers.TaskFrequencyResponse:
    properties:
      frequency:
        type: string
      label:
        type: string
      label_jp:
        type: string
    type: object
  handlers.TaskPriorityListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.TaskPriorityResponse'
        type: array
    type: object
  handlers.TaskPriorityResponse:
    properties:
      label:
        type: string
      label_jp:
        type: string
      priority:
        type: string
      weight:
        type: integer
    type: object
  handlers.TaskStatusListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.TaskStatusResponse'
        type: array
    type: object
  handlers.TaskStatusResponse:
    properties:
      label:
        type: string
      label_jp:
        type: string
      status:
        type: string
    type: object
  handlers.UserCreateRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handlers.UserInfoUpdateRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
    type: object
  handlers.UserPasswordUpdateRequest:
    properties:
      new_password:
        type: string
    type: object
  handlers.UserResponse:
    properties:
      email:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Task scheduling API server.
  title: task2schedule API
  version: "1.0"
paths:
  /access-token/current:
    delete:
      description: Revokes the current access token from the Authorization header.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to revoke access token
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Revoke access token
      tags:
      - Access Tokens
  /access-tokens:
    post:
      consumes:
      - application/json
      description: Generates a new access token for a user.
      parameters:
      - description: Access token generate request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AccessTokenGenerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AccessTokenResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to generate access token
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      summary: Generate access token
      tags:
      - Access Tokens
  /monitor/health:
    get:
      description: Returns the API health status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
        "500":
          description: Failed to marshal response
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      summary: Check API health
      tags:
      - Monitor
  /projects/types:
    get:
      description: Returns all project type master data.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectTypeListResponse'
        "500":
          description: Failed to list project types
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      summary: List project types
      tags:
      - Projects
  /tasks/frequencies:
    get:
      description: Returns all task frequency master data.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TaskFrequencyListResponse'
        "500":
          description: Failed to list task frequencies
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      summary: List task frequencies
      tags:
      - Tasks
  /tasks/priorities:
    get:
      description: Returns all task priority master data.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TaskPriorityListResponse'
        "500":
          description: Failed to list task priorities
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      summary: List task priorities
      tags:
      - Tasks
  /tasks/statuses:
    get:
      description: Returns all task status master data.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TaskStatusListResponse'
        "500":
          description: Failed to list task statuses
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      summary: List task statuses
      tags:
      - Tasks
  /users:
    post:
      consumes:
      - application/json
      description: Creates a user with an email address and password.
      parameters:
      - description: User create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UserCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to create user
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      summary: Create user
      tags:
      - Users
  /users/me:
    get:
      description: Returns the authenticated user's profile.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to get user
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Updates the authenticated user's first and last name.
      parameters:
      - description: User basic info update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UserInfoUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to update user
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Update current user basic info
      tags:
      - Users
  /users/me/password:
    patch:
      consumes:
      - application/json
      description: Updates the authenticated user's password.
      parameters:
      - description: User password update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UserPasswordUpdateRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to update password
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Update current user password
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
