info:
  contact: {}
  description: Task scheduling API server.
  title: task2todaytodo API
  version: "1.0"
paths:
  /access-token:revoke:
    delete:
      description: Revokes the current access token from the Authorization header.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_port_rest.MessageResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "500":
          description: Failed to revoke access token
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
      security:
      - BearerAuth: []
      summary: Revoke access token
      tags:
      - Access Tokens
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and generates an access token.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_port_rest.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_port_rest.AccessTokenResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "500":
          description: Failed to generate access token
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
      summary: Log in
      tags:
      - Access Tokens
  /permissions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_port_rest.PermissionListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
      security:
      - BearerAuth: []
      summary: List permissions
      tags:
      - Authorization
  /projects:
    get:
      parameters:
      - description: Items per page (default 50, maximum 100)
        in: query
        name: page_size
        type: integer
      - description: Opaque next page token
        in: query
        name: page_token
        type: string
      - description: Response field mask
        in: query
        name: fields
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_port_rest.ProjectListResponse'
        "400":
          description: Bad Request
