host: localhost:8080
info:
  contact: {}
  description: Task scheduling API server.
  title: task2todaytodo API
  version: "1.0"
paths:
  /access-token/current:
    delete:
      description: Revokes the current access token from the Authorization header.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to revoke access token
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Revoke access token
      tags:
      - Access Tokens
  /access-tokens:
    post:
      consumes:
      - application/json
      description: Generates a new access token for a user.
      parameters:
      - description: Access token generate request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AccessTokenGenerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AccessTokenResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to generate access token
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      summary: Generate access token
      tags:
      - Access Tokens
  /monitor/health:
    get:
      description: Returns the API health status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
        "500":
          description: Failed to marshal response
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      summary: Check API health
      tags:
      - Monitor
  /projects:
    post:
      consumes:
      - application/json
      description: Creates a Project for the authenticated user.
      parameters:
      - description: Project create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ProjectCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.ProjectResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "409":
          description: Project ID already exists
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to create project
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - Projects
  /projects/{project_id}:
    delete:
      description: Deletes an owned Project. Existing Tasks are kept and detached
        by database constraints.
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to delete project
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Delete project
      tags:
      - Projects
    get:
      description: Returns an owned Project with its Tasks ordered by creation time.
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectAggregateResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to get project
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Get project
      tags:
      - Projects
    patch:
      consumes:
      - application/json
      description: Partially updates owned Project basic information.
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Project basic update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ProjectUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to update project
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Update project basic information
      tags:
      - Projects
  /projects/{project_id}/priority:
    patch:
      consumes:
      - application/json
      description: Updates owned Project priority.
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Project priority update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ProjectPriorityUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to update project
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Update project priority
      tags:
      - Projects
  /projects/{project_id}/schedule:
    patch:
      consumes:
      - application/json
      description: Partially updates owned Project schedule.
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Project schedule update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ProjectScheduleUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to update project
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Update project schedule
      tags:
      - Projects
  /projects/{project_id}/tasks:
    post:
      consumes:
      - application/json
      description: Creates a Task under an owned Project.
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Task create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.TaskCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.TaskResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to create task
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Create project task
      tags:
      - Tasks
  /projects/types:
    get:
      description: Returns all project type master data.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectTypeListResponse'
        "500":
          description: Failed to list project types
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      summary: List project types
      tags:
      - Projects
  /tasks:
    post:
      consumes:
      - application/json
      description: Creates a standalone Task for the authenticated user.
      parameters:
      - description: Task create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.TaskCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.TaskResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
        "500":
          description: Failed to create task
          schema:
            $ref: '#/definitions/handlers.ErrResponse'
      security:
      - BearerAuth: []
      summary: Create task
      tags:
      - Tasks
  /tasks/{task_id}:
    delete:
      description: Deletes an owned Task.
      parameters:
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
