info:
  contact: {}
  description: Task scheduling API server.
  title: task2todaytodo API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and generates an access token.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.PersonalAccessTokenResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/rest.ErrResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/rest.ErrResponse'
        "500":
          description: Failed to generate access token
          schema:
            $ref: '#/definitions/rest.ErrResponse'
      summary: Log in
      tags:
      - Personal Access Tokens
  /permissions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.PermissionListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.ErrResponse'
      security:
      - BearerAuth: []
      summary: List permissions
      tags:
      - Authorization
  /personal-access-token:revoke:
    delete:
      description: Revokes the current access token from the Authorization header.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.MessageResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/rest.ErrResponse'
        "500":
          description: Failed to revoke access token
          schema:
            $ref: '#/definitions/rest.ErrResponse'
      security:
      - BearerAuth: []
      summary: Revoke personal access token
      tags:
      - Personal Access Tokens
  /projects:
    get:
      parameters:
      - description: Filter by Project status
        enum:
        - in_progress
        - pending
        - done
        - open
        - waiting_on_others
        in: query
        name: status
        type: string
      - description: active or trash
        enum:
        - active
        - trash
        in: query
        name: view
        type: string
      - description: Server-side sort column; end_date sorts by remaining days. Null
          dates sort last; equal dates sort by priority high-first, then stable ID.
        enum:
        - created_at
        - title
        - progress
        - end_date
        in: query
        name: sort_by
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - description: Items per page (default 50, maximum 100)
        in: query
        name: page_size
        type: integer
      - description: Opaque cursor for previous or next page
        in: query
        name: page_token
        type: string
      - description: Response field mask
        in: query
        name: fields
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.ProjectListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.ErrResponse'
      security:
      - BearerAuth: []
      summary: List projects
      tags:
      - Projects
    post:
      consumes:
