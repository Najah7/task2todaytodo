        change recurrence weekdays. occurrence_date is stable occurrence identity
        and may differ from due_date after an edit.
      parameters:
      - description: Task ID
        in: path
        name: taskId
        required: true
        type: string
      - description: ActionItem series ID
        in: path
        name: id
        required: true
