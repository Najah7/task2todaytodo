          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
      security:
      - BearerAuth: []
      summary: List projects
      tags:
      - Projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Project
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_port_rest.ProjectCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_port_rest.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - Projects
  /projects/{id}:
    delete:
      parameters:
      - description: Current project ETag, for example \
        in: header
        name: If-Match
        required: true
        type: string
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "409":
          description: Revision conflict
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "428":
          description: If-Match is required
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_port_rest.ErrResponse'
      security:
      - BearerAuth: []
      summary: Delete project
      tags:
      - Projects
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
