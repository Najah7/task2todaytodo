services:
  db:
    container_name: task2todaytodo-db
    image: postgres:18.4-trixie
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
      timeout: 5s
      start_period: 15s
    networks:
      - backend
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
  
  migrate:
    container_name: task2todaytodo-migrate
    image: migrate/migrate:v4.19.1
    networks:
      - backend
    volumes:
      - ${PROJECT_ROOT}/db/migrations:/db/migrations
    depends_on:
      - db

  sqlc:
    container_name: task2todaytodo-sqlc
    image: sqlc/sqlc:1.31.1
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/sqlc.yml:/sqlc.yml
      - ${PROJECT_ROOT}/db/migrations:/db/migrations
      - ${PROJECT_ROOT}/db/queries:/db/queries
      - ${PROJECT_ROOT}/db/sqlc:/db/sqlc
    depends_on:
      - db

  swagger:
    container_name: task2todaytodo-swagger
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.25-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        ENTRYPOINT ["swag"]
    working_dir: /code
    volumes:
      - ${PROJECT_ROOT}:/code

  air:
    container_name: task2todaytodo-air
    image: cosmtrek/air
    working_dir: /code
    environment:
      - PAGE_TOKEN_KEY=${PAGE_TOKEN_KEY:?PAGE_TOKEN_KEY must be set}
      - SERVER_ADDR=:8080
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-api}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_EXPORTER_OTLP_TRACES_HEADERS=${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      - OTEL_EXPORTER_OTLP_TIMEOUT=${OTEL_EXPORTER_OTLP_TIMEOUT:-}
      - OTEL_EXPORTER_OTLP_TRACES_TIMEOUT=${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:-}
      - OTEL_EXPORTER_OTLP_COMPRESSION=${OTEL_EXPORTER_OTLP_COMPRESSION:-}
      - OTEL_EXPORTER_OTLP_TRACES_COMPRESSION=${OTEL_EXPORTER_OTLP_TRACES_COMPRESSION:-}
      - OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:-}
      - OTEL_EXPORTER_OTLP_TRACES_INSECURE=${OTEL_EXPORTER_OTLP_TRACES_INSECURE:-}
      - OTEL_EXPORTER_OTLP_CERTIFICATE=${OTEL_EXPORTER_OTLP_CERTIFICATE:-}
      - OTEL_EXPORTER_OTLP_TRACES_CERTIFICATE=${OTEL_EXPORTER_OTLP_TRACES_CERTIFICATE:-}
      - OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE=${OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE:-}
      - OTEL_EXPORTER_OTLP_TRACES_CLIENT_CERTIFICATE=${OTEL_EXPORTER_OTLP_TRACES_CLIENT_CERTIFICATE:-}
      - OTEL_EXPORTER_OTLP_CLIENT_KEY=${OTEL_EXPORTER_OTLP_CLIENT_KEY:-}
      - OTEL_EXPORTER_OTLP_TRACES_CLIENT_KEY=${OTEL_EXPORTER_OTLP_TRACES_CLIENT_KEY:-}
    volumes:
      - ${PROJECT_ROOT}:/code
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - backend
    command: ["-c", ".air.toml"]


networks:
  backend:
volumes:
  db-data:
